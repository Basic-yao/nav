<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="icon" href="data:image/x-icon;base64,AAABAAEAEBAAAAEAIABoBAAAFgAAACgAAAAQAAAAIAAAAAEAIAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAA...">
 <title>网址导航</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo" id="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a90e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>网址导航</span>
      </div>
      <nav class="nav-list" id="navList"></nav>
      <button class="theme-btn" id="themeBtn">
        <span class="theme-icon">🌙</span>
        <span class="theme-text">深色模式</span>
      </button>
    </aside>

    <main class="main">
      <div class="search-box">
        <div class="search-tags" id="searchTags"></div>
        <div class="search-input-row">
          <input type="text" class="search-input" id="subSearchInput" placeholder="Bing 搜索">
          <button class="search-btn" id="subSearchBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
        </div>
      </div>
      <div class="content" id="content"></div>
    </main>
  </div>
  <!-- ★ data.js 必须在 app.js 之前，因为 app.js 用到 navData -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
