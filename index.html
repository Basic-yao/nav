<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网址导航</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <!-- 左侧栏 -->
    <aside class="sidebar" id="navList"></aside>
    
    <!-- 主内容区 -->
    <main class="main">
      <!-- 顶部固定横栏 -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="menuToggle">☰</button>
          <div class="logo-mobile">网址导航</div>
        </div>
        <div class="search-wrapper">
          <input type="text" id="topSearch" placeholder="搜索网址..." class="top-search">
        </div>
        <div class="topbar-right">
          <button id="toggle-theme" class="theme-btn"><span class="theme-icon">🌙</span> <span class="theme-text">深色模式</span></button>
          <span class="code-icon">&lt;/&gt;</span>
        </div>
      </header>

      <!-- 次级搜索/标签区 -->
      <div class="sub-search-area">
        <div class="tags">
          <span>社区</span> <span class="arrow">&gt;</span>
          <span class="tag">知乎</span>
          <span class="tag">微信</span>
          <span class="tag">微博</span>
          <span class="tag">豆瓣</span>
          <span class="tag">搜外问答</span>
        </div>
        <div class="mini-search">
          <input type="text" value="知乎">
          <button>🔍</button>
        </div>
      </div>

      <!-- 内容容器 -->
      <div class="content" id="navContainer"></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
