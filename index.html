<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网址导航</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <!-- 左侧栏 -->
    <aside class="sidebar" id="navList"></aside>
    
    <!-- 右侧主区 -->
    <main class="main">
      <header class="top-bar">
        <div class="top-left">☰</div>
        <div class="top-search">
          <input type="text" id="topSearch" placeholder="搜索网址...">
        </div>
        <div class="top-right">
          <button id="toggle-theme">
            <span class="theme-icon">🌙</span><span class="theme-text">深色模式</span>
          </button>
          <span>&lt;/&gt;</span>
        </div>
      </header>
      
      <!-- 次级搜索区（按图保留） -->
      <div class="sub-search-area">
        <span>社区</span> <span>&gt;</span>
        <span class="tag">知乎</span> <span class="tag">微信</span> <span class="tag">微博</span>
        <span class="tag">豆瓣</span> <span class="tag">搜外问答</span>
        <div class="sub-search-box">
          <input value="知乎"><button>🔍</button>
        </div>
      </div>

      <div id="navContainer" class="content"></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
