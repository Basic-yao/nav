<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网址导航</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <!-- 左侧栏 -->
    <aside class="sidebar" id="navList"></aside>
    
    <!-- 右侧主区 -->
    <main class="main">
      <header class="top-bar">
        <div class="search-main">
          <input type="text" id="topSearch" placeholder="搜索网址或站点...">
          <button id="searchBtn">🔍</button>
        </div>
        <div class="top-actions">
          <span class="code-tag">&lt;/&gt;</span>
        </div>
      </header>

      <!-- 次级搜索区 -->
      <div class="sub-search-area">
        <div class="sub-tags" id="subTags"></div>
        <div class="sub-search-box">
          <input type="text" id="subSearchInput" placeholder="百度一下">
          <button id="subSearchBtn">🔍</button>
        </div>
      </div>

      <div class="content" id="container"></div>
    </main>
  </div>
  
  <button id="toggle-theme" class="theme-btn">
    <span class="theme-icon">🌙</span> <span class="theme-text">深色模式</span>
  </button>

  <script src="app.js"></script>
</body>
</html>
