<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网址导航</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <!-- 左侧栏 -->
    <aside class="sidebar">
      <div class="logo"><span class="cloud-icon">☁️</span> 网址导航</div>
      <div class="nav-list" id="navList"></div>
      <div class="sidebar-bottom">
        <button id="toggle-theme"><span class="theme-icon">🌙</span> <span class="theme-text">深色模式</span></button>
      </div>
    </aside>
    
    <!-- 右侧主区 -->
    <main class="main">
      <!-- 顶部通栏 -->
      <header class="topbar">
        <span class="menu-toggle" id="menuToggle">☰</span>
        <div class="search-wrapper">
          <input type="text" id="topSearch" placeholder="搜索网址或站点..." autocomplete="off">
          <button id="searchBtn" class="search-btn">🔍</button>
        </div>
        <span class="code-icon">&lt;/&gt;</span>
      </header>
      
      <!-- 次级搜索标签区（真实搜索切换） -->
      <div class="sub-search-area" id="subSearchArea">
        <div class="sub-tags" id="subTags"></div>
        <div class="sub-input-wrapper">
          <input type="text" id="subSearchInput" placeholder="百度一下" autocomplete="off">
          <button id="subSearchBtn" class="sub-search-btn">🔍</button>
        </div>
      </div>
      
      <!-- 内容区 -->
      <div class="content" id="navContainer"></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
