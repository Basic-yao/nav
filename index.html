<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nav</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <img src="logo.png" alt="logo" class="logo-img" id="logoImg">
          <span class="logo-text">Nav</span>
        </div>
        <nav class="nav-list" id="navList">
          <!-- 由JS渲染 -->
        </nav>
      </div>
      <div class="sidebar-bottom">
        <button id="toggle-theme" class="theme-btn">
          <span class="theme-icon">🌙</span>
          <span class="theme-text">深色模式</span>
        </button>
      </div>
    </aside>
    <main class="main-content">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索网站或分类... (按 / 聚焦)">
      </div>
      <div id="navContainer" class="content-area"></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
