<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='1' y='1' width='6.6' height='6.6' rx='1.8' fill='%231677ff'/><rect x='8.7' y='1' width='6.6' height='6.6' rx='1.8' fill='%231677ff'/><rect x='16.4' y='1' width='6.6' height='6.6' rx='1.8' fill='%231677ff'/><rect x='1' y='8.7' width='6.6' height='6.6' rx='1.8' fill='%231677ff'/><rect x='8.7' y='8.7' width='6.6' height='6.6' rx='1.8' fill='%231677ff'/><rect x='16.4' y='8.7' width='6.6' height='6.6' rx='1.8' fill='%231677ff'/><rect x='1' y='16.4' width='6.6' height='6.6' rx='1.8' fill='%231677ff'/><rect x='8.7' y='16.4' width='6.6' height='6.6' rx='1.8' fill='%231677ff'/><rect x='16.4' y='16.4' width='6.6' height='6.6' rx='1.8' fill='%231677ff'/></svg>" type="image/svg+xml">
 <title>My Nav</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo" id="logo">
        <svg class="logo-mark" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <rect x="1" y="1" width="6.6" height="6.6" rx="1.8"/>
          <rect x="8.7" y="1" width="6.6" height="6.6" rx="1.8"/>
          <rect x="16.4" y="1" width="6.6" height="6.6" rx="1.8"/>
          <rect x="1" y="8.7" width="6.6" height="6.6" rx="1.8"/>
          <rect x="8.7" y="8.7" width="6.6" height="6.6" rx="1.8"/>
          <rect x="16.4" y="8.7" width="6.6" height="6.6" rx="1.8"/>
          <rect x="1" y="16.4" width="6.6" height="6.6" rx="1.8"/>
          <rect x="8.7" y="16.4" width="6.6" height="6.6" rx="1.8"/>
          <rect x="16.4" y="16.4" width="6.6" height="6.6" rx="1.8"/>
        </svg>
        <span>网址导航</span>
      </div>
      <nav class="nav-list" id="navList"></nav>
      <button class="theme-btn" id="themeBtn">
        <span class="theme-icon"></span>
        <span class="theme-text">深色模式</span>
      </button>
    </aside>
    <main class="main">
      <div class="search-box">
        <div class="search-tags" id="searchTags">
          <button class="tag active" data-engine="site">站内</button><span class="arrow">&gt;</span>
          <button class="tag" data-engine="bing">Bing</button><span class="arrow">&gt;</span>
          <button class="tag" data-engine="baidu">百度</button><span class="arrow">&gt;</span>
          <button class="tag" data-engine="google">Google</button>
        </div>
        <div class="search-input-row">
          <input type="text" class="search-input" id="subSearchInput" placeholder="按 \ 快速唤起搜索">
          <button class="search-btn" id="subSearchBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
        </div>
      </div>
      <div class="content" id="content"></div>
    </main>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
