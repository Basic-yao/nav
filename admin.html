<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231677ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z'></path></svg>" type="image/svg+xml"> 
 <title>网址导航后台管理</title>
  <link rel="stylesheet" href="styles.css">
</head>

<!-- 登录弹窗 -->
<div id="loginOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:999999;">
  <div style="background:#fff; padding:30px; border-radius:8px; box-shadow:0 5px 15px rgba(0,0,0,0.3); text-align:center; width:320px;">
    <h2 style="margin:0 0 15px;">管理登录</h2>
    <input type="password" id="adminPwd" placeholder="请输入密码" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
    <button id="loginBtn" style="width:100%; padding:10px; background:#1677ff; color:#fff; border:none; border-radius:4px; cursor:pointer;">登录</button>
    <p id="loginMsg" style="color:red; font-size:13px; margin-top:10px; display:none;">密码错误</p>
  </div>
</div>

<script>
(function(){
  // 在这里修改你的管理密码
  var correctPassword = '123321';

  function checkLogin() {
    var input = document.getElementById('adminPwd').value;
    if (input === correctPassword) {
      document.getElementById('loginOverlay').style.display = 'none';
    } else {
      document.getElementById('loginMsg').style.display = 'block';
    }
  }

  document.getElementById('loginBtn').onclick = checkLogin;
  document.getElementById('adminPwd').onkeydown = function(e) {
    if (e.key === 'Enter') checkLogin();
  };
})();
</script>

<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo" id="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          <path d="M2 12h20"></path>
        </svg>
        <span>网址导航</span>
      </div>
      <nav class="nav-list" id="navList"></nav>
      <button class="theme-btn" id="themeBtn">
        <span class="theme-icon"></span>
        <span class="theme-text">深色模式</span>
      </button>
    </aside>

    <main class="main">
      <div class="search-box">
        <div class="search-tags" id="searchTags"></div>
        <div class="search-input-row">
          <input type="text" class="search-input" id="subSearchInput" placeholder="按 / 快速唤起站内搜索">
          <button class="search-btn" id="subSearchBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
        </div>
      </div>
      <div class="content" id="content"></div>
    </main>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="custom.js"></script>
</body>
</html>
